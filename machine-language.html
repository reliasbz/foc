<!DOCTYPE html>
<html>
<head>
  <title>A Simple Interactive Machine Language</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 40px;
    }
    .box {
      background-color: white;
      padding: 25px;
      max-width: 700px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      margin-right: 8px;
      margin-bottom: 10px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #003d80;
    }
    img {
      max-width: 100%;
      margin-top: 15px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="box">
    <a href="project.html">Back to My Projects</a>
    <h2>A Simple Interactive Machine Language</h2>
    <p>Click an instruction below to see what it does:</p>

    <button onclick="showStep('156C')">156C</button>
    <button onclick="showStep('166D')">166D</button>
    <button onclick="showStep('5056')">5056</button>
    <button onclick="showStep('306E')">306E</button>
    <button onclick="showStep('C000')">C000</button>

    <p id="explanation"><strong>Click a button above to start.</strong></p>

    <img id="slideImage" src="image/ML1.png" alt="Machine Language Table">
  </div>

  <script>
    function showStep(code) {
      if (code == "156C") {
        document.getElementById("explanation").innerHTML = "156C: LOAD register 5 with the bit pattern from memory cell 6C.";
        document.getElementById("slideImage").src = "image/ML1.png";
      }
      else if (code == "166D") {
        document.getElementById("explanation").innerHTML = "166D: LOAD register 6 with the bit pattern from memory cell 6D.";
        document.getElementById("slideImage").src = "image/ML2.png";
      }
      else if (code == "5056") {
        document.getElementById("explanation").innerHTML = "5056: ADD the contents of registers 5 and 6, and store the result in register 0.";
        document.getElementById("slideImage").src = "image/ML3.png";
      }
      else if (code == "306E") {
        document.getElementById("explanation").innerHTML = "306E: STORE the bit pattern in register 0 into memory cell 6E.";
        document.getElementById("slideImage").src = "image/ML4.png";
      }
      else if (code == "C000") {
        document.getElementById("explanation").innerHTML = "C000: HALT (stop program execution).";
        document.getElementById("slideImage").src = "image/ML5.png";
      }
    }
  </script>

</body>
</html>
