<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('image').src='image/noton.png'">On</button>

<img id="image" src="image/notoff.png" style="width:500px" alt="bike">

<button onclick="document.getElementById('image').src='image/notoff.png'">Off</button>

</body>
</html>
