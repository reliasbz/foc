<!DOCTYPE html>
<html>
<head>
  <title>UNICODE Lookup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 40px;
    }
    .box {
      background-color: white;
      padding: 25px;
      max-width: 650px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    input {
      padding: 8px;
      font-size: 16px;
      width: 150px;
    }
    button {
      padding: 8px 15px;
      font-size: 16px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #output {
      font-size: 40px;
      margin-top: 15px;
    }
    img {
      max-width: 100%;
      margin-top: 15px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="box">
    <a href="project.html">Back to My Projects</a>
    <h2>UNICODE Character Lookup</h2>
    <p>Enter a hexadecimal Unicode value (e.g. 0041 or 1F986):</p>

    <input type="text" id="hexInput" placeholder="e.g. 0041">
    <button onclick="findUnicode()">Show Character</button>

    <p id="output"></p>

    <h3>Reference Charts:</h3>
    <img src="image/uni1.jpg" alt="Latin Unicode Chart">
    <img src="image/uni3.jpg" alt="Emoji Unicode Chart">
    <img src="image/uni4.jpg" alt="Hangul Unicode Chart">
  </div>

  <script>
    function findUnicode() {
      var hex = document.getElementById("hexInput").value;
      var number = parseInt(hex, 16);

      if (isNaN(number)) {
        document.getElementById("output").innerHTML = "Please enter a valid hex code.";
      } else {
        document.getElementById("output").innerHTML = String.fromCodePoint(number);
      }
    }
  </script>

</body>
</html>
