<!DOCTYPE html>
<html>
<head>
  <title>ASCII Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 40px;
    }
    .box {
      background-color: white;
      padding: 25px;
      max-width: 550px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    input {
      padding: 8px;
      font-size: 16px;
      width: 200px;
    }
    button {
      padding: 8px 15px;
      font-size: 16px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #003d80;
    }
    hr {
      margin: 25px 0;
      border: 0;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="box">
    <a href="project.html">Back to My Projects</a>
    <h2>ASCII Converter</h2>
    <p>ASCII matches numbers from 0 to 127 with characters.</p>

    <h3>1. Text to ASCII</h3>
    <p>Type text to see the decimal ASCII code for each character:</p>
    <input type="text" id="textInput" placeholder="e.g. Hi">
    <button onclick="textToAscii()">Convert text</button>
    <p><strong>Decimal code(s):</strong> <span id="asciiOutput"></span></p>

    <hr>

    <h3>2. ASCII Number to Character</h3>
    <p>Enter one decimal ASCII number from 0 to 127:</p>
    <input type="text" id="numInput" placeholder="e.g. 65">
    <button onclick="asciiToChar()">Show character</button>
    <p><strong>Character:</strong> <span id="charOutput"></span></p>
  </div>

  <script>
    function textToAscii() {
      var text = document.getElementById("textInput").value;
      var result = "";

      for (var i = 0; i < text.length; i++) {
        result = result + text.charCodeAt(i) + " ";
      }

      document.getElementById("asciiOutput").innerHTML = result;
    }

    function asciiToChar() {
      var num = document.getElementById("numInput").value;

      if (num < 0 || num > 127 || num == "") {
        document.getElementById("charOutput").innerHTML = "Please enter a number from 0 to 127.";
      } else {
        document.getElementById("charOutput").innerHTML = String.fromCharCode(num);
      }
    }
  </script>

</body>
</html>
