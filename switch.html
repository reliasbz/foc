<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('image').src='image/onbike.jpg'">Riding</button>

<img id="image" src="image/offbike.jpg" style="width:100px" alt="bike">

<button onclick="document.getElementById('image').src='image/offbike.jpg'">Ouch!</button>

</body>
</html>
