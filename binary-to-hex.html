<!DOCTYPE html>
<html>
<head>
  <title>Binary to Hexadecimal Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 40px;
    }
    .box {
      background-color: white;
      padding: 25px;
      max-width: 500px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    input {
      padding: 8px;
      font-size: 16px;
      width: 150px;
    }
    button {
      padding: 8px 15px;
      font-size: 16px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    img {
      max-width: 100%;
      margin-top: 20px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="box">
    <a href="project.html">Back to My Projects</a>
    <h2>Binary to Hexadecimal Converter</h2>
    <p>Enter a 4-digit binary number (0000 to 1111):</p>

    <input type="text" id="binInput" maxlength="4" placeholder="e.g. 1010">
    <button onclick="convertToHex()">Convert</button>

    <p><strong>Hexadecimal Result:</strong> <span id="result"></span></p>

    <img src="bintohex.jpg" alt="Binary to Hex Chart">
  </div>

  <script>
    function convertToHex() {
      var bin = document.getElementById("binInput").value;
      var hex = "";

      if (bin == "0000") { hex = "0"; }
      else if (bin == "0001") { hex = "1"; }
      else if (bin == "0010") { hex = "2"; }
      else if (bin == "0011") { hex = "3"; }
      else if (bin == "0100") { hex = "4"; }
      else if (bin == "0101") { hex = "5"; }
      else if (bin == "0110") { hex = "6"; }
      else if (bin == "0111") { hex = "7"; }
      else if (bin == "1000") { hex = "8"; }
      else if (bin == "1001") { hex = "9"; }
      else if (bin == "1010") { hex = "A"; }
      else if (bin == "1011") { hex = "B"; }
      else if (bin == "1100") { hex = "C"; }
      else if (bin == "1101") { hex = "D"; }
      else if (bin == "1110") { hex = "E"; }
      else if (bin == "1111") { hex = "F"; }
      else { hex = "Invalid input! Enter 4 digits (0s and 1s)."; }

      document.getElementById("result").innerHTML = hex;
    }
  </script>

</body>
</html>
